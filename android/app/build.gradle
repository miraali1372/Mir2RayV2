apply plugin: 'com.android.application'

// Signing secrets are read from env vars or a gitignored keystore.properties (never hardcoded).
def keystorePropsFile = file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Keystore file path - can be overridden by env var for CI/CD
def releaseKeystoreFile = file(System.getenv('MIR2RAY_KEYSTORE_FILE') ?: 'release-keystore.jks')
def releaseKeystorePassword = System.getenv('MIR2RAY_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword') ?: project.findProperty('MIR2RAY_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MIR2RAY_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias') ?: project.findProperty('MIR2RAY_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MIR2RAY_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword') ?: releaseKeystorePassword
def hasReleaseSigningCredentials = releaseKeystoreFile.exists() && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword
def appVersionName = System.getenv('MIR2RAY_VERSION_NAME') ?: (project.findProperty('MIR2RAY_VERSION_NAME') ?: '1.0.6')
def appVersionCode = (System.getenv('MIR2RAY_VERSION_CODE') ?: (project.findProperty('MIR2RAY_VERSION_CODE') ?: '7')) as Integer

// Only validate keystore exists for release builds
if (System.getenv('MIR2RAY_KEYSTORE_PASSWORD') || keystoreProps.getProperty('storePassword') || project.hasProperty('MIR2RAY_KEYSTORE_PASSWORD')) {
    if (!releaseKeystoreFile.exists()) {
        throw new GradleException("Missing release keystore: ${releaseKeystoreFile}. Set MIR2RAY_KEYSTORE_FILE env var or place keystore at release-keystore.jks")
    }
}

android {
    namespace = "com.mir2ray.app"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (hasReleaseSigningCredentials) {
                storeFile = releaseKeystoreFile
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.mir2ray.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments = [
            liveProxy: 'vless://00000000-0000-4000-8000-000000000001@10.0.2.2:24081'
        ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigningCredentials) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Prevent stripping of libgojni.so which causes issues with NDK 27
    packagingOptions {
        doNotStrip "**/libgojni.so"
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def versionLabel = variant.versionName ?: defaultConfig.versionName
            outputFileName = variant.buildType.name == 'debug'
                ? "Mir2rayV2-debug.apk"
                : "Mir2rayV2-v${versionLabel}.apk"
        }
    }
}

repositories {
    // Use local Maven repository for AAR files instead of flatDir (deprecated)
    maven {
        url = uri('../local-maven-repo')
    }
    maven {
        url = uri('../capacitor-cordova-android-plugins/local-maven-repo')
    }
    // Use mirror for legacy testing artifacts that may be unavailable from dl.google.com
    maven {
        url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public')
        content {
            includeGroup 'com.google.testing.platform'
            includeModule 'com.google.testing.platform', 'core-proto'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // WorkManager for background monitoring
    implementation 'androidx.work:work-runtime:2.11.2'
    // libv2ray from local Maven repo
    implementation 'com.mir2ray:libv2ray:26.9.9@aar'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
